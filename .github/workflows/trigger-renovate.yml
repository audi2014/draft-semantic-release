name: Trigger Renovate on App

on:
  # Trigger when the Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  trigger-renovate:
    runs-on: ubuntu-latest
    # Only trigger if the Release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Get published version from npm registry
        id: package-info
        run: |
          # Get the branch that triggered the release
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
          # Determine which dist-tag to query based on branch
          if [ "$BRANCH" = "master" ]; then
            DIST_TAG="latest"
          elif [ "$BRANCH" = "beta" ]; then
            DIST_TAG="beta"
          elif [ "$BRANCH" = "devel" ]; then
            DIST_TAG="devel"
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi
          
          echo "Querying npm registry for @audi2014/npmjs-test@$DIST_TAG"
          
          # Get the actual published version from npm registry
          VERSION=$(npm view @audi2014/npmjs-test@$DIST_TAG version)
          
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to get version from npm registry"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT
          echo "✅ Package @audi2014/npmjs-test@$VERSION (dist-tag: $DIST_TAG) was published from branch $BRANCH"

      - name: Trigger Renovate in App Repo
        run: |
          echo "Triggering Renovate for version ${{ steps.package-info.outputs.version }} on branch ${{ steps.package-info.outputs.branch }}"
          
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RENOVATE_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/audi2014/draft-semantic-release-app/dispatches \
            -d '{"event_type":"renovate-trigger","client_payload":{"package":"@audi2014/npmjs-test","version":"${{ steps.package-info.outputs.version }}","branch":"${{ steps.package-info.outputs.branch }}"}}'
          
          echo "✅ Renovate triggered successfully!"
