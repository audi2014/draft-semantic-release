name: Trigger Renovate on App

on:
  workflow_dispatch:
  # Trigger when the Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  trigger-renovate:
    runs-on: ubuntu-latest
    # Only trigger if the Release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get published version from git tag
        id: package-info
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: npx ts-node .scripts/get-package-info.ts

      - name: Check branch and trigger Renovate in App Repo
        if: steps.package-info.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_WEBHOOK_PAT }}
          BRANCH: ${{ steps.package-info.outputs.branch }}
          VERSION: ${{ steps.package-info.outputs.version }}
          DIST_TAG: ${{ steps.package-info.outputs.dist_tag }}
          SANITIZED_TAG: ${{ steps.package-info.outputs.sanitized_tag }}
        run: npx ts-node .scripts/trigger-renovate.ts
