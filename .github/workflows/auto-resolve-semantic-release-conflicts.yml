name: Auto-resolve Semantic Release Conflicts

# Triggers on PRs to beta and master branches
on:
  workflow_dispatch:
#  pull_request:
#    branches:
#      - beta
#      - master
#    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-resolve-conflicts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run conflict resolution script
        id: resolve
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: npx ts-node .scripts/auto-resolve-conflicts.ts

      - name: Comment on PR (if resolved)
        if: steps.resolve.outputs.resolved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Auto-resolved semantic-release conflicts**\n\n' +
                    'Conflicts in `CHANGELOG.md`, `package.json`, and `package-lock.json` were automatically resolved.\n\n' +
                    '**Strategy:** Kept source branch versions (these will be regenerated by semantic-release on the target branch)\n\n' +
                    '✅ Ready for review and merge!'
            })

      - name: Comment on PR (if cannot resolve)
        if: steps.resolve.outputs.resolved == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Unable to auto-resolve conflicts**\n\n' +
                    'This PR has conflicts in files outside of semantic-release managed files.\n' +
                    'Manual resolution is required.\n\n' +
                    'Please resolve conflicts manually and push your changes.'
            })
